services:
  postgres:
    image: postgres:16-alpine
    container_name: ksales-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ksales
      POSTGRES_USER: ksales_app
      POSTGRES_PASSWORD: ksales_dev
    ports:
      - "5432:5432"
    volumes:
      - ksales_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksales_app -d ksales"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ksales_postgres_data:
