# Nginx — kalebhawi.com.br, com a aplicação ksales publicada em /sales.
#
# Destino na VPS: /etc/nginx/sites-available/kalebhawi.com.br
# Ativação:       ln -sf /etc/nginx/sites-available/kalebhawi.com.br \
#                        /etc/nginx/sites-enabled/kalebhawi.com.br
#
# Este arquivo declara apenas a porta 80 de propósito. O `certbot --nginx`
# duplica este server block para a 443, insere os caminhos dos certificados e
# transforma este aqui em redirecionamento — tudo sozinho. Se já viesse com um
# bloco 443 pronto, `nginx -t` falharia antes do certbot rodar, porque os
# arquivos em /etc/letsencrypt/live/ ainda não existem.
#
# ATENÇÃO: se já existir um server block para kalebhawi.com.br servindo a raiz
# do site, NÃO substitua o arquivo — copie apenas os blocos `location /sales…`
# para dentro do server block que já existe. Dois server blocks com o mesmo
# server_name fazem o Nginx ignorar silenciosamente o segundo.

upstream ksales_app {
    server 127.0.0.1:3000;

    # Reaproveita conexões com o Node. Exige `proxy_http_version 1.1` e
    # `proxy_set_header Connection ""` nos locations abaixo.
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name kalebhawi.com.br www.kalebhawi.com.br;

    client_max_body_size 8m;

    # ---------------------------------------------------------------
    # Raiz do domínio: mantenha o que já servia hoje. O bloco abaixo só
    # existe para o arquivo ser válido sozinho num primeiro teste.
    # ---------------------------------------------------------------
    location / {
        root /var/www/html;
        # `index.nginx-debian.html` na lista para a raiz continuar servindo o que
        # já servia antes do ksales entrar: sem ele o Nginx tenta listar o
        # diretório e responde 403.
        index index.html index.nginx-debian.html;
        try_files $uri $uri/ =404;
    }

    # ---------------------------------------------------------------
    # ksales — basePath "/sales"
    # ---------------------------------------------------------------

    # Assets com hash no nome. O Next já responde com
    # `Cache-Control: immutable`, então aqui é só repasse.
    location /sales/_next/static/ {
        proxy_pass http://ksales_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location /sales {
        # Sem barra no fim do proxy_pass: o prefixo /sales precisa chegar
        # inteiro no Next, que é quem resolve o basePath. Com barra, o Nginx
        # removeria o prefixo e toda rota daria 404.
        proxy_pass http://ksales_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Streaming de RSC: o Nginx não pode segurar a resposta em buffer,
        # senão o conteúdo sob Suspense chega todo de uma vez no fim.
        proxy_buffering off;
        proxy_read_timeout 120s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Usado pelo limitador de tentativas de login em src/lib/rate-limit.ts.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

# ---------------------------------------------------------------------------
# Referência: como fica o bloco 443 depois do certbot. Não descomente à mão —
# deixe o certbot escrever. Está aqui só para conferência e para o caso de
# precisar remontar o arquivo manualmente.
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     server_name kalebhawi.com.br www.kalebhawi.com.br;
#
#     ssl_certificate     /etc/letsencrypt/live/kalebhawi.com.br/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/kalebhawi.com.br/privkey.pem;
#     include /etc/letsencrypt/options-ssl-nginx.conf;
#     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
#
#     # HTTP/2: no Ubuntu 24.04 (nginx 1.24) é `listen 443 ssl http2;`.
#     # A diretiva separada `http2 on;` só existe a partir do nginx 1.25.1 —
#     # usá-la no 1.24 derruba o `nginx -t` com "unknown directive".
#     # Confira com `nginx -v` antes de habilitar.
#
#     ... mesmos locations do bloco 80 ...
# }
#
# E o bloco 80 vira:
#
# server {
#     listen 80;
#     server_name kalebhawi.com.br www.kalebhawi.com.br;
#     return 301 https://$host$request_uri;
# }
# ---------------------------------------------------------------------------
